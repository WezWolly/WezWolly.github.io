<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | CertifiWise</title>

<style>
:root{
  --navy:#153761;
  --navy-hover:#1d4a82;
  --panel:#f5f5f5;
  --text:#10233f;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  color:white;
  min-height:100vh;
  background:
    linear-gradient(rgba(21,55,97,0.55), rgba(21,55,97,0.55)),
    url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1800&q=80')
    center center / cover no-repeat fixed;
}

/* Header height matched to homepage */
header{
  background:var(--navy);
  height:122px;
  display:flex;
  align-items:center;
  padding:0 42px;
}

.nav{
  width:100%;
  max-width:1200px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  color:white;
  text-decoration:none;
  font-size:30px;
  font-weight:700;
}

nav{
  display:flex;
  gap:34px;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:600;
  font-size:18px;
}

nav a:hover{
  text-decoration:underline;
}

.wrapper{
  min-height:calc(100vh - 122px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 20px 64px;
}

.panel{
  width:min(760px, 100%);
  background:var(--panel);
  color:var(--text);
  padding:34px 38px 40px;
  box-shadow:0 18px 40px rgba(0,0,0,0.25);
}

h1{
  margin:0 0 22px;
  line-height:0.9;
  font-size:72px;
  font-weight:800;
  color:var(--navy);
}

h1 span{
  display:block;
  font-size:32px;
  font-style:italic;
  font-weight:700;
  margin-bottom:6px;
}

form{
  display:flex;
  flex-direction:column;
  gap:16px;
}

input, textarea{
  width:100%;
  padding:16px;
  border:2px solid var(--navy);
  font-size:18px;
  background:white;
  color:#222;
}

textarea{
  min-height:190px;
  resize:vertical;
}

.consent{
  display:flex;
  align-items:flex-start;
  gap:12px;
  font-size:15px;
  line-height:1.45;
}

.consent input{
  width:24px;
  height:24px;
  margin-top:2px;
  accent-color:var(--navy);
}

button{
  width:160px;
  margin-top:8px;
  padding:14px 18px;
  border:none;
  border-radius:999px;
  background:var(--navy);
  color:white;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  background:var(--navy-hover);
}

@media (max-width:700px){
  header{
    height:auto;
    padding:18px 20px;
  }

  .nav{
    flex-direction:column;
    gap:14px;
  }

  nav{
    gap:18px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .wrapper{
    min-height:auto;
    padding-top:30px;
  }

  .panel{
    padding:26px 22px 30px;
  }

  h1{font-size:54px;}
  h1 span{font-size:26px;}
  input, textarea{font-size:16px;}
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <a class="brand" href="/">CertifiWise</a>

    <nav>
      <a href="/#about">About</a>
      <a href="/#courses">Courses</a>
      <a href="/contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="wrapper">

<section class="panel">

<h1><span>GET</span>in touch</h1>

<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

<input type="text" name="name" placeholder="Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number">

<input type="email" name="email" placeholder="E-mail" required>

<input type="text" name="address" placeholder="Address">

<textarea name="message" placeholder="Tell us about your enquiry"></textarea>

<label class="consent">
  <input type="checkbox" name="consent" required>
  <span>I accept the above information will be used to contact me.</span>
</label>

<button type="submit">SUBMIT</button>

</form>

</section>

</main>

</body>
</html>
