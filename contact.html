<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get in touch | Certifiwise</title>

  <style>
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#efefef;
      color:#1a0b2b;
    }

    .contact-wrapper{
      max-width:1200px;
      margin:40px auto;
      padding:0 20px;
      display:flex;
      gap:40px;
      align-items:flex-start;
    }

    .form-side{
      flex:1;
    }

    .form-side h1{
      margin:0;
      font-size:56px;
      line-height:0.9;
      font-weight:800;
    }

    .form-side h1 span{
      display:block;
      color:#ff6a21;
      font-size:28px;
      font-style:italic;
      font-weight:700;
      margin-bottom:8px;
    }

    form{
      margin-top:28px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    input, textarea{
      width:100%;
      padding:16px 14px;
      border:2px solid #ff6a21;
      border-radius:2px;
      font-size:16px;
      background:white;
      box-sizing:border-box;
    }

    textarea{
      min-height:140px;
      resize:vertical;
    }

    .consent{
      display:flex;
      align-items:flex-start;
      gap:12px;
      font-size:15px;
      line-height:1.4;
    }

    .consent input{
      width:24px;
      height:24px;
      margin-top:2px;
      accent-color:#ff6a21;
    }

    button{
      align-self:flex-start;
      background:#ff6a21;
      color:white;
      border:none;
      border-radius:999px;
      padding:14px 38px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }

    .image-side{
      flex:1;
      display:flex;
      justify-content:center;
    }

    .image-side img{
      width:100%;
      max-width:520px;
      border-radius:28px;
      display:block;
    }

    @media (max-width:900px){
      .contact-wrapper{
        flex-direction:column;
      }

      .form-side h1{
        font-size:42px;
      }
    }
  </style>
</head>

<body>

  <div class="contact-wrapper">

    <div class="form-side">
      <h1><span>GET</span>in touch</h1>

      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="tel" name="phone" placeholder="Phone Number">

        <input type="email" name="email" placeholder="E-mail" required>

        <input type="text" name="address" placeholder="Project Address">

        <textarea name="message" placeholder="Tell us about your project"></textarea>

        <label class="consent">
          <input type="checkbox" name="consent" required>
          <span>I accept the above information will be used to contact me.</span>
        </label>

        <button type="submit">SUBMIT</button>

      </form>
    </div>

    <div class="image-side">
      <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=900&q=80"
           alt="Contact team">
    </div>

  </div>

</body>
</html>
